name: CampusConnect CI

on:
  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify frontend files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          echo "Frontend files verified successfully!"

      - name: Automated Tests
        run: node tests/app.test.js

      - name: Security Scanning
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln,misconfig,secret'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'

      - name: Build Docker image
        run: docker build -t campusconnect:v1 .

  production-approval:
    needs: build
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Production approval granted
        run: echo "Production deployment approved!"
